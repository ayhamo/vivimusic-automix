# Fork-only workflow. It checks upstream Vivimusic Web in its two places: the
# latest GitHub release tag of Archimetrix/VIVIMUSIC_WEB (Chrome source) and
# the current AMO version (Firefox port, never pushed to GitHub).
#
# It runs only when started by hand (Actions -> Run workflow): the user watches
# upstream and says when to merge and build. When upstream or this fork's main
# has something not released yet (or "force" is on), it merges upstream into this
# branch's patches (in the runner only, nothing is pushed), lints, signs the
# Firefox build on AMO and publishes a GitHub release. If a merge needs a human
# (conflicts, new upstream manifest changes) or the linter finds errors, the
# run fails and nothing is published.
name: Fork sync and release

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the release even if it exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fork-sync-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Archimetrix/VIVIMUSIC_WEB
  AMO_SLUG: vivimusicxten

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      gh_tag: ${{ steps.ver.outputs.gh_tag }}
      amo_version: ${{ steps.ver.outputs.amo_version }}
      tag: ${{ steps.ver.outputs.tag }}
      old_tag: ${{ steps.ver.outputs.old_tag }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - name: compare upstream versions with fork releases
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          gh_tag=$(gh release view -R "$UPSTREAM_REPO" --json tagName --jq .tagName)
          amo_version=$(curl -fsSL "https://addons.mozilla.org/api/v5/addons/addon/$AMO_SLUG/" | jq -r .current_version.version)
          # (both come from outside: only a plain version or tag goes on, never anything a shell would read)
          for v in "$gh_tag" "$amo_version"; do
            if ! [[ "$v" =~ ^[vV]?[0-9A-Za-z._-]+$ ]]; then echo "refusing an upstream version that isn't plain: '$v'"; exit 1; fi
          done
          ours=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF_NAME}" --jq .sha)
          # the build number before the commit: GitHub sorts same-day releases by tag name, and a bare
          # hash put 11.5.0.42 (e07f670) above 11.5.0.43 (1db61b0). b<run number, 5 digits> = the version's last part.
          tag="fork-${gh_tag}-amo${amo_version}-b$(printf %05d "$GITHUB_RUN_NUMBER")-${ours:0:7}"
          # this commit already released (any build number) on the same upstream versions
          old_tag=$(gh release list -R "$GITHUB_REPOSITORY" -L 200 --json tagName --jq ".[].tagName" | grep -E "^fork-${gh_tag}-amo${amo_version}-(b[0-9]{5}-)?${ours:0:7}$" | head -1 || true)
          echo "upstream GitHub: $gh_tag | upstream AMO: $amo_version | fork: ${ours:0:7}"
          echo "gh_tag=$gh_tag" >> "$GITHUB_OUTPUT"
          echo "amo_version=$amo_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "old_tag=$old_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$old_tag" ] && [ "$FORCE" != "true" ]; then
            echo "$old_tag already released, nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # the spec suites first (and again in build, on the merged code): a release is never built and signed with a failing spec
  spec:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/spec-tests.yml

  build:
    needs: [check, spec]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      # no token left in .git/config: nothing here pushes, and the npx packages below must not find it
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # (upstream's tag and AMO version reach the shell as variables only, never pasted into the script)
      - name: merge upstream GitHub release (Chrome source)
        env:
          GH_TAG: ${{ needs.check.outputs.gh_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --tags upstream
          python scripts/merge_upstream.py "$GH_TAG" --commit

      - name: merge upstream AMO build (Firefox port)
        env:
          AMO_VERSION: ${{ needs.check.outputs.amo_version }}
        run: python scripts/sync_upstream_firefox.py --apply --remote upstream --tag "v$AMO_VERSION"

      # M22: the spec suites on the merged code, the one that is signed and published
      - name: spec suites on the merged code
        run: bash scripts/run_spec.sh

      - name: set a higher version and build the zips
        id: build
        env:
          UPDATE_URL: ${{ vars.UPDATE_URL }}
        run: |
          set -euo pipefail
          # AMO needs a new, higher version for every upload: <manifest version>.<run number>
          version=$(jq -r .version manifest.json).${GITHUB_RUN_NUMBER}
          jq --arg v "$version" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          # Firefox auto-update: only once there is a public place for updates.json (repo variable UPDATE_URL)
          if [ -n "${UPDATE_URL}" ]; then
            jq --arg u "$UPDATE_URL" '.browser_specific_settings.gecko.update_url = $u' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          fi
          python scripts/build_zip.py
          mkdir -p out
          mv vivimusic-automix-firefox.zip "out/vivimusic-automix-${version}-firefox.zip"
          mv vivimusic-automix-edge-chrome.zip "out/vivimusic-automix-${version}-edge-chrome.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: lint with addons-linter (fails on errors)
        env:
          UPDATE_URL: ${{ vars.UPDATE_URL }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          # with an update_url the add-on updates from our own releases: lint it as self-hosted
          self=""; if [ -n "${UPDATE_URL}" ]; then self="--self-hosted"; fi
          npx --yes addons-linter@10.15.0 "out/vivimusic-automix-${VERSION}-firefox.zip" $self --output json > lint.json || true
          jq '.summary' lint.json
          jq -r '.errors[] | "ERROR \(.code): \(.message) \(.file // "")"' lint.json
          test "$(jq '.summary.errors' lint.json)" = "0"

      # Unlisted signing on AMO with the add-on's API key (repo secrets
      # AMO_JWT_ISSUER and AMO_JWT_SECRET, from AMO Developer Hub -> Tools ->
      # Manage API Keys). Without them the step is skipped and the zip is
      # uploaded by hand as before.
      - name: sign on AMO (unlisted)
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AMO_JWT_ISSUER}" ] || [ -z "${AMO_JWT_SECRET}" ]; then
            echo "no AMO API key secrets: not signing"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p signsrc signed
          unzip -q "out/vivimusic-automix-${VERSION}-firefox.zip" -d signsrc
          # the key reaches web-ext through its own env variables, never on its command line (seen by every process)
          WEB_EXT_API_KEY="$AMO_JWT_ISSUER" WEB_EXT_API_SECRET="$AMO_JWT_SECRET" \
            npx --yes web-ext@10.8.0 sign --source-dir signsrc --artifacts-dir signed --channel unlisted --approval-timeout 1800000
          xpi=$(ls signed/*.xpi | head -1)
          mv "$xpi" "out/vivimusic-automix-${VERSION}-firefox.xpi"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Firefox's update manifest for the update_url: points at this release's signed .xpi
      - name: write updates.json
        if: steps.sign.outputs.signed == 'true' && vars.UPDATE_URL != ''
        env:
          VERSION: ${{ steps.build.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          id=$(jq -r .browser_specific_settings.gecko.id manifest.json)
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/vivimusic-automix-${VERSION}-firefox.xpi"
          jq -n --arg id "$id" --arg v "$VERSION" --arg l "$link" '{addons: {($id): {updates: [{version: $v, update_link: $l}]}}}' > out/updates.json
          cat out/updates.json

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ steps.build.outputs.version }}
          GH_TAG: ${{ needs.check.outputs.gh_tag }}
          AMO_VERSION: ${{ needs.check.outputs.amo_version }}
          OLD_TAG: ${{ needs.check.outputs.old_tag }}
        run: |
          set -euo pipefail
          # force: this commit's earlier release goes (its tag had another build number)
          for t in "$OLD_TAG" "$TAG"; do
            if [ -n "$t" ] && gh release view "$t" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
          {
            echo "Vivimusic Web+ ${VERSION}: this fork's patches on top of upstream, for Firefox and for Edge / Chrome."
            echo
            echo "- Upstream GitHub: ${GH_TAG} (https://github.com/${UPSTREAM_REPO}/releases/tag/${GH_TAG})"
            echo "- Upstream Firefox (AMO): ${AMO_VERSION}"
            echo "- Fork commit: ${GITHUB_SHA}"
            echo
            if [ -f "out/vivimusic-automix-${VERSION}-firefox.xpi" ]; then
              echo "- Firefox: vivimusic-automix-${VERSION}-firefox.xpi, signed by AMO (unlisted). Open it in Firefox to install or update."
            else
              echo "- Firefox: vivimusic-automix-${VERSION}-firefox.zip. Sign it at https://addons.mozilla.org/en-US/developers/addons -> Vivimusic Web+ -> Upload New Version."
            fi
            echo "- Edge / Chrome: vivimusic-automix-${VERSION}-edge-chrome.zip. Unzip it, open edge://extensions (or chrome://extensions), turn on Developer mode, Load unpacked -> the unzipped folder. To update: replace the folder's contents, then press Reload on the extension."
          } > notes.md
          files=("out/vivimusic-automix-${VERSION}-firefox.zip" "out/vivimusic-automix-${VERSION}-edge-chrome.zip")
          for f in "out/vivimusic-automix-${VERSION}-firefox.xpi" out/updates.json; do [ -f "$f" ] && files+=("$f"); done
          gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "Vivimusic Web+ ${VERSION} (upstream ${GH_TAG}, AMO ${AMO_VERSION})" \
            --notes-file notes.md --latest
